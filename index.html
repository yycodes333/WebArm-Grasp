<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目每日记录共享表格</title>
    <!-- 引入supabase js库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{box-sizing: border-box;font-family:system-ui}
        .container{max-width:1100px;margin:20px auto;padding:0 15px;}
        .form-box{border:1px solid #ccc;padding:20px;border-radius:8px;margin-bottom:30px;background:#f8f9fa;}
        .row{margin:10px 0;}
        label{display:inline-block;width:120px;}
        input,textarea{width:320px;padding:8px;border:1px solid #aaa;border-radius:4px;}
        textarea{height:70px;}
        button{padding:9px 22px;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer;font-size:15px;}
        table{width:100%;border-collapse: collapse;}
        th,td{border:1px solid #aaa;padding:10px;text-align:left;}
        th{background:#e9edf7;}
    </style>
</head>
<body>
<div class="container">
    <h2>项目每日工作记录（多人实时共享）</h2>

    <!-- 填写表单 -->
    <div class="form-box">
        <h3>新增记录</h3>
        <div class="row">
            <label>姓名：</label>
            <input type="text" id="inp_name" placeholder="输入你的姓名">
        </div>
        <div class="row">
            <label>今日完成内容：</label>
            <textarea id="inp_content" placeholder="填写今日完成内容"></textarea>
        </div>
        <div class="row">
            <label>对项目帮助：</label>
            <textarea id="inp_help" placeholder="填写对项目帮助"></textarea>
        </div>
        <div class="row">
            <label></label>
            <button onclick="submitRecord()">提交记录</button>
        </div>
    </div>

    <!-- 数据表格 -->
    <h3>共享记录列表</h3>
    <table>
        <thead>
        <tr>
            <th>姓名</th>
            <th>时间</th>
            <th>今日完成内容</th>
            <th>对项目帮助</th>
        </tr>
        </thead>
        <tbody id="table_body">
        </tbody>
    </table>
</div>

<script>
// ========== 替换成你自己supabase的信息 ==========
const SUPABASE_URL = "url:https://rzidngvtemuvzrrybqai.supabase.co";
const SUPABASE_ANON_KEY = "publish key: sb_publishable_A8KS2Y-pOveCsnbOKL0JVw_ooKEfu2y";
// ==============================================

const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 渲染表格
async function renderTable(){
    const {data,error}=await supabase
        .from('daily_record')
        .select('*')
        .order('create_time',{asc:false}); //最新的放最上面
    if(error) return console.error(error);
    const tbody=document.getElementById("table_body");
    tbody.innerHTML="";
    data.forEach(item=>{
        const tr=document.createElement("tr");
        //格式化时间
        const t=new Date(item.create_time).toLocaleString("zh-CN");
        tr.innerHTML=`
            <td>${escapeHtml(item.name??"")}</td>
            <td>${t}</td>
            <td>${escapeHtml(item.finish_content??"")}</td>
            <td>${escapeHtml(item.project_help??"")}</td>
        `;
        tbody.appendChild(tr);
    })
}

//提交表单
async function submitRecord(){
    const name=document.getElementById("inp_name").value.trim();
    const finish_content=document.getElementById("inp_content").value.trim();
    const project_help=document.getElementById("inp_help").value.trim();
    if(!name){
        alert("请填写姓名");
        return;
    }
    const {error}=await supabase.from("daily_record").insert([{
        name:name,
        finish_content:finish_content,
        project_help:project_help
    }])
    if(error){
        alert("提交失败:"+error.message);
    }else{
        //清空输入框
        document.getElementById("inp_content").value="";
        document.getElementById("inp_help").value="";
    }
}

// 开启实时监听：别人新增数据，页面自动刷新表格
function startRealtime(){
    supabase
        .channel('table-change')
        .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'daily_record'
        }, payload => {
            console.log("数据库发生变化",payload);
            renderTable();
        })
        .subscribe()
}

//简单防XSS
function escapeHtml(str){
    if(!str) return "";
    return str.replace(/[&<>"']/g, m=>{
        const map={"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"};
        return map[m];
    })
}

window.onload=()=>{
    renderTable();
    startRealtime();
}
</script>
</body>
</html>
