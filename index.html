<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>项目每日工作记录（多人实时共享）</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .form-box {
            background-color: #f7f8fa;
            border: 1px solid #ddd;
            border-radius:8px;
            padding:24px;
            max-width:750px;
            margin:0 auto 32px;
        }
        .form-item {
            margin-bottom:14px;
        }
        label {
            display: inline-block;
            width:120px;
            font-weight:bold;
        }
        input,textarea {
            width:420px;
            padding:8px;
            border:1px solid #bbb;
            border-radius:4px;
            font-size:14px;
        }
        textarea {
            min-height:80px;
        }
        button {
            background:#2563eb;
            color:white;
            border:none;
            border-radius:4px;
            padding:10px 22px;
            font-size:15px;
            cursor:pointer;
        }
        table {
            width:100%;
            border-collapse: collapse;
        }
        th,td {
            border:1px solid #aaa;
            padding:10px;
        }
        th {
            background:#e8ebf7;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center;">项目每日工作记录（多人实时共享）</h1>

    <div class="form-box">
        <h3>新增记录</h3>
        <div class="form-item">
            <label>姓名：</label>
            <input id="inp-name" type="text">
        </div>
        <div class="form-item">
            <label>今日完成内容：</label>
            <textarea id="inp-finish"></textarea>
        </div>
        <div class="form-item">
            <label>对项目帮助：</label>
            <textarea id="inp-help"></textarea>
        </div>
        <div class="form-item">
            <label></label>
            <button onclick="submitRecord()">提交记录</button>
        </div>
    </div>

    <h3>共享记录列表</h3>
    <table>
        <thead>
            <tr>
                <th>姓名</th>
                <th>时间</th>
                <th>今日完成内容</th>
                <th>对项目帮助</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

<!-- supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============ 已填入你的密钥 ============
const SUPABASE_URL = "https://rzidngvtemuvzrrybqai.sb.co";
const SUPABASE_ANON_KEY = "sb_publishable_A8KS2Y-pOveCsnbOKL0JVw_ooKEfu2y";
// =========================================

const { createClient } = supabase;
// 修改变量名为 sb，规避CDN全局supabase变量冲突
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

//渲染表格
async function renderTable() {
    const { data, error } = await sb
        .from("daily_record")
        .select("*")
        .order("created_at", {asc: false});

    if(error){
        console.error("读取表格错误", error);
        return;
    }
    const tableBody = document.querySelector("#table-body");
    tableBody.innerHTML = "";
    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row.name ?? ""}</td>
            <td>${new Date(row.created_at).toLocaleString()}</td>
            <td>${row.finish_content ?? ""}</td>
            <td>${row.help_content ?? ""}</td>
        `;
        tableBody.appendChild(tr);
    })
}

//提交记录
async function submitRecord(){
    const name = document.querySelector("#inp-name").value.trim();
    const finish_content = document.querySelector("#inp-finish").value.trim();
    const help_content = document.querySelector("#inp-help").value.trim();

    if(!name){
        alert("请填写姓名");
        return;
    }

    const {error} = await sb.from("daily_record").insert([{
        name,
        finish_content,
        help_content
    }]);

    if(error){
        console.error("插入失败", error);
        alert("提交失败："+error.message);
    }else{
        //清空输入框
        document.querySelector("#inp-name").value = "";
        document.querySelector("#inp-finish").value = "";
        document.querySelector("#inp-help").value = "";
        renderTable();
    }
}

//开启实时监听数据库变化
sb.channel('table_change')
.on('postgres_changes',
    {event:'*', schema:'public', table:'daily_record'},
    (payload)=>{ renderTable(); }
).subscribe();

window.onload = function(){
    renderTable();
}
</script>
</body>
</html>
